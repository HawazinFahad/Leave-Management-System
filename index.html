<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>نظام إدارة الإجازات</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#003462; --blue:#0071B9; --teal:#00A88B;
    --skye:#B9D8EA; --mist:#C6CDD1;
    --bg:#F4F7F9; --ink:#1B2430; --muted:#6B7684; --muted-lt:#9AA5B1;
    --pending:#B7791F; --pending-bg:#FBF3E3;
    --approved:#00795E; --approved-bg:#E1F5EF;
    --rejected:#B42318; --rejected-bg:#FBEAE9;
    --cancelled:#5B6472; --cancelled-bg:#EDEFF1;
    --radius-card:16px; --radius-ctl:12px;
    --shadow-soft:0 1px 2px rgba(0,52,98,.06),0 4px 16px rgba(0,52,98,.06);
    --shadow-lift:0 2px 4px rgba(0,52,98,.08),0 12px 28px rgba(0,52,98,.10);
  }
  *{box-sizing:border-box;}
  html{direction:rtl;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;
    font-feature-settings:'tnum' 1;
  }
  button, input, select, textarea{font-family:inherit; font-size:inherit;}
  *:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:6px;}
  a{color:inherit;}

  /* -------- Layout -------- */
  .header{position:sticky; top:0; z-index:30; background:rgba(255,255,255,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--mist);}
  .header-inner{max-width:1120px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-badge{width:36px; height:36px; border-radius:12px; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0;}
  .brand-title{font-size:14px; font-weight:700; color:var(--navy); margin:0;}
  .brand-sub{font-size:12px; color:var(--muted-lt); margin:0;}
  .user-box{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end;}
  .user-name{font-size:13px; font-weight:600; color:var(--navy); margin:0; text-align:left;}
  .user-role{font-size:11px; color:var(--muted-lt); margin:0; text-align:left;}
  .tabs-row{max-width:1120px; margin:0 auto; padding:0 20px 10px; display:flex; gap:4px; overflow-x:auto;}
  .tab-btn{border:none; background:transparent; padding:9px 14px; border-radius:var(--radius-ctl); font-weight:600; font-size:13.5px; color:var(--muted); cursor:pointer; white-space:nowrap; transition:background .15s, color .15s;}
  .tab-btn.active{background:var(--navy); color:#fff;}
  .tab-btn:not(.active):hover{background:rgba(185,216,234,.35); color:var(--navy);}
  .main{max-width:1120px; margin:0 auto; padding:22px 20px 60px;}
  @media (max-width:560px){
    .header-inner{padding:10px 14px;}
    .user-box{width:100%; justify-content:space-between;}
    .main{padding:16px 14px 48px;}
  }

  /* -------- Buttons -------- */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:var(--radius-ctl); font-weight:700; font-size:13.5px; cursor:pointer; padding:10px 18px; transition:background .15s;}
  .btn:disabled{cursor:not-allowed; opacity:.5;}
  .btn-primary{background:var(--navy); color:#fff;}
  .btn-primary:hover:not(:disabled){background:#012c53;}
  .btn-secondary{background:#fff; color:var(--navy); border:1px solid var(--mist);}
  .btn-secondary:hover:not(:disabled){background:rgba(185,216,234,.2);}
  .btn-danger{background:var(--rejected); color:#fff;}
  .btn-danger:hover:not(:disabled){background:#932017;}
  .btn-ghost{background:transparent; color:var(--navy);}
  .btn-sm{padding:6px 12px; font-size:12.5px;}
  .btn-block{width:100%;}
  .spinner{width:16px; height:16px; border-radius:50%; border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .7s linear infinite; display:inline-block;}
  .spinner-dark{border:2.5px solid rgba(0,52,98,.2); border-top-color:var(--navy);}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* -------- Cards -------- */
  .card{background:#fff; border:1px solid rgba(198,205,209,.6); border-radius:var(--radius-card); padding:18px; box-shadow:var(--shadow-soft); transition:box-shadow .18s, transform .18s;}
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:20px;}
  .stat-grid .card:hover{box-shadow:var(--shadow-lift); transform:translateY(-1px);}
  .stat-label{font-size:13px; color:var(--muted); display:block; margin-bottom:4px;}
  .stat-value{font-size:28px; font-weight:800; color:var(--navy);}
  .stat-value.teal{color:var(--teal);}
  .stat-value.blue{color:var(--blue);}

  /* -------- Forms -------- */
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
  .field label{font-size:13.5px; font-weight:700; color:var(--navy);}
  .field .req{color:var(--rejected);}
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--mist); border-radius:var(--radius-ctl); padding:10px 13px;
    background:#fff; color:var(--ink);
  }
  .field input:disabled{background:#F8FAFB; color:var(--muted-lt);}
  .field textarea{min-height:88px; resize:vertical;}
  .field .hint{font-size:12px; color:var(--muted-lt);}
  .field .err{font-size:12px; font-weight:600; color:var(--rejected);}
  .form-row-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:600px){.form-row-2{grid-template-columns:1fr;}}

  /* -------- Badges -------- */
  .badge{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap;}
  .badge::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor;}
  .badge.pending{background:var(--pending-bg); color:var(--pending);}
  .badge.approved{background:var(--approved-bg); color:var(--approved);}
  .badge.rejected{background:var(--rejected-bg); color:var(--rejected);}
  .badge.cancelled{background:var(--cancelled-bg); color:var(--cancelled);}

  /* -------- Table -------- */
  .table-wrap{overflow-x:auto; background:#fff; border:1px solid rgba(198,205,209,.6); border-radius:var(--radius-card); box-shadow:var(--shadow-soft);}
  table{width:100%; border-collapse:collapse; min-width:760px; font-size:13.5px; text-align:right;}
  thead tr{background:#F9FAFB; border-bottom:1px solid var(--mist);}
  th{padding:12px 14px; font-size:12px; color:var(--muted); font-weight:700;}
  td{padding:12px 14px; border-bottom:1px solid rgba(198,205,209,.35); color:#3A4552; vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tbody tr:nth-child(even){background:#FBFCFD;}
  tr:hover td{background:rgba(185,216,234,.14); transition:background .12s;}
  .link-btn{background:none; border:none; padding:0; color:var(--blue); font-weight:700; cursor:pointer; font-size:inherit; font-family:inherit;}
  .link-btn:hover{text-decoration:underline;}
  .muted{color:var(--muted-lt); font-size:12px;}

  /* -------- Modal -------- */
  .overlay{position:fixed; inset:0; background:rgba(0,52,98,.4); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; padding:16px; z-index:200;}
  .modal{background:#fff; border-radius:var(--radius-card); box-shadow:var(--shadow-lift); width:100%; max-width:560px; max-height:88vh; display:flex; flex-direction:column;}
  .modal.lg{max-width:820px;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid rgba(198,205,209,.6);}
  .modal-head h2{margin:0; font-size:15px; font-weight:800; color:var(--navy);}
  .modal-close{background:none; border:none; cursor:pointer; color:var(--muted-lt); font-size:18px; line-height:1; padding:4px;}
  .modal-body{padding:18px 20px; overflow-y:auto;}
  .modal-foot{display:flex; justify-content:flex-end; gap:8px; padding:14px 20px; border-top:1px solid rgba(198,205,209,.6);}

  /* -------- Toasts -------- */
  #toast-host{position:fixed; bottom:18px; left:18px; z-index:400; display:flex; flex-direction:column; gap:8px; max-width:340px;}
  .toast{padding:12px 16px; border-radius:var(--radius-ctl); font-size:13.5px; font-weight:600; box-shadow:var(--shadow-lift); border:1px solid;}
  .toast.success{background:var(--approved-bg); color:var(--approved); border-color:rgba(0,121,94,.2);}
  .toast.error{background:var(--rejected-bg); color:var(--rejected); border-color:rgba(180,35,24,.2);}
  .toast.info{background:rgba(185,216,234,.4); color:var(--navy); border-color:rgba(0,113,185,.2);}

  /* -------- Misc -------- */
  .empty{border:1px dashed var(--mist); border-radius:var(--radius-card); padding:48px 20px; text-align:center; color:var(--muted); background:rgba(255,255,255,.6);}
  .error-box{border:1px solid rgba(180,35,24,.2); background:var(--rejected-bg); border-radius:var(--radius-card); padding:24px; text-align:center; color:var(--rejected); font-weight:700;}
  .center-loading{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:60px 0; color:var(--muted);}
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-card{width:100%; max-width:420px;}
  .login-logo{width:52px; height:52px; border-radius:16px; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px; margin:0 auto 10px;}
  .settings-box{margin-top:14px; border:1px solid var(--mist); border-radius:var(--radius-ctl); padding:12px 14px; font-size:12.5px; color:var(--muted);}
  .settings-box summary{cursor:pointer; font-weight:700; color:var(--navy);}
  .demo-box{margin-top:14px; border:1px solid rgba(0,113,185,.2); background:rgba(185,216,234,.2); border-radius:var(--radius-ctl); padding:12px 14px; font-size:12px; color:var(--navy);}
  .demo-box ul{margin:6px 0 0; padding-inline-start:18px;}
  .flex-between{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  .page-title{font-size:18px; font-weight:800; color:var(--navy); margin:0;}
  .segmented{display:flex; gap:3px; background:#fff; padding:4px; border-radius:var(--radius-ctl); box-shadow:var(--shadow-soft);}
  .filter-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; background:#fff; border:1px solid rgba(198,205,209,.6); border-radius:var(--radius-card); padding:16px; box-shadow:var(--shadow-soft); margin-bottom:16px;}
  @media (max-width:800px){.filter-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:480px){.filter-grid{grid-template-columns:1fr;}}
  .pagination-row{display:flex; align-items:center; justify-content:space-between; padding-top:12px; font-size:13px; color:var(--muted);}
  .info-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; background:#F9FAFB; border-radius:var(--radius-ctl); padding:14px;}
  @media (max-width:600px){.info-grid{grid-template-columns:1fr 1fr;}}
  .info-grid .k{font-size:11.5px; color:var(--muted-lt); display:block;}
  .info-grid .v{font-size:13.5px; font-weight:700; color:var(--navy);}
  .breakdown-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px;}
  @media (max-width:700px){.breakdown-grid{grid-template-columns:1fr;}}
  .breakdown-list{list-style:none; margin:0; padding:0; font-size:13.5px;}
  .breakdown-list li{display:flex; justify-content:space-between; padding:4px 0;}
  .req-summary-box{background:#F9FAFB; border:1px solid var(--mist); border-radius:var(--radius-ctl); padding:14px; font-size:13px; margin-bottom:14px;}
  .req-summary-box dl{display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; margin:8px 0 0;}
  .req-summary-box dt{color:var(--muted-lt);}
  .req-summary-box dd{margin:0;}
  .calc-box{border:1px solid var(--skye); background:rgba(185,216,234,.2); border-radius:var(--radius-ctl); padding:12px 14px; font-size:13.5px; margin-bottom:14px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-host"></div>
<script>
"use strict";
/* =============================================================
 * نظام إدارة الإجازات — تطبيق ملف واحد (HTML/JS بدون أدوات بناء)
 * =============================================================
 * يعمل مباشرة بفتح الملف في المتصفح. بدون Node.js أو npm أو أي تثبيت.
 *
 * الاتصال بالخادم: يقرأ رابط Google Apps Script من الإعدادات المحفوظة
 * محلياً في هذا المتصفح (localStorage). إن لم يُعرَّف رابط، يعمل التطبيق
 * تلقائياً على بيانات تجريبية داخلية (نفس منطق الصلاحيات والحساب تماماً)
 * حتى تتمكن من تجربته فوراً دون أي إعداد.
 * ============================================================= */

// ------------------------------- الإعدادات -------------------------------

/**
 * ⚠️ عدّلي هذا السطر فقط قبل نشر الملف على GitHub (أو أي استضافة أخرى)،
 * وضعي رابط Apps Script الفعلي بين علامتي التنصيص. بهذا يعمل التطبيق
 * تلقائياً لكل موظف يفتح الرابط، دون أي إعداد أو تدخل من أحد.
 *
 * هذا الرابط ليس سراً (راجع الملاحظة الأمنية في README) — الحماية الفعلية
 * كلها من جهة الخادم (Code.gs)، لذا لا مشكلة أمنية بوضعه هنا صراحة حتى لو
 * كان المستودع عاماً (public) على GitHub.
 */
var DEFAULT_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsjF6sHnfXTNa2ofrsmEvWTSFVjGvbz0rqni7fhY3BpkiXobBJWAMy4Iw1TYIy3WMl/exec";

var SETTINGS_KEY = "leave_app_settings_v1";
var SESSION_KEY = "leave_app_session_v1";

function loadSettings() {
  try {
    var raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {
    /* تجاهل — نكمل بالإعداد الافتراضي أدناه */
  }
  return { appsScriptUrl: DEFAULT_APPS_SCRIPT_URL, useMock: !DEFAULT_APPS_SCRIPT_URL };
}
function saveSettings(settings) {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  } catch (e) {
    /* تجاهل بصمت */
  }
}

var SETTINGS = loadSettings();

function isUsingMock() {
  return SETTINGS.useMock || !SETTINGS.appsScriptUrl;
}

// -------------------------- إدارة الجلسة (بدون كلمة مرور) --------------------------

function saveSession(session) {
  try {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
  } catch (e) {
    /* تجاهل بصمت */
  }
}
function loadSession() {
  try {
    var raw = sessionStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}
function clearSession() {
  try {
    sessionStorage.removeItem(SESSION_KEY);
  } catch (e) {
    /* تجاهل بصمت */
  }
}

// ================================================================
// دوال التاريخ المركزية — مستقلة عن توقيت الجهاز (خوارزمية JDN)
// المنطقة الزمنية المرجعية: Asia/Riyadh (UTC+03:00 بدون توقيت صيفي)
// نفس الخوارزمية المستخدمة يجب تكرارها في Apps Script الخاص بالخادم
// حتى يتطابق حساب الواجهة مع إعادة تحقق الخادم تماماً.
// ================================================================

function parseISODate(iso) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso).trim());
  if (!m) throw new Error("تاريخ غير صالح: " + iso);
  var y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  if (mo < 1 || mo > 12 || d < 1 || d > 31) throw new Error("تاريخ غير صالح: " + iso);
  return { y: y, m: mo, d: d };
}

function toISODate(ymd) {
  function pad(n, len) { var s = String(n); while (s.length < len) s = "0" + s; return s; }
  return pad(ymd.y, 4) + "-" + pad(ymd.m, 2) + "-" + pad(ymd.d, 2);
}

function toSerial(ymd) {
  var a = Math.floor((14 - ymd.m) / 12);
  var y2 = ymd.y + 4800 - a;
  var m2 = ymd.m + 12 * a - 3;
  return ymd.d + Math.floor((153 * m2 + 2) / 5) + 365 * y2 + Math.floor(y2 / 4) - Math.floor(y2 / 100) + Math.floor(y2 / 400) - 32045;
}

function fromSerial(serial) {
  var a = serial + 32044;
  var b = Math.floor((4 * a + 3) / 146097);
  var c = a - Math.floor((146097 * b) / 4);
  a = c;
  var d2 = Math.floor((4 * a + 3) / 1461);
  var e = a - Math.floor((1461 * d2) / 4);
  var m2 = Math.floor((5 * e + 2) / 153);
  var d = e - Math.floor((153 * m2 + 2) / 5) + 1;
  var m = m2 + 3 - 12 * Math.floor(m2 / 10);
  var y = 100 * b + d2 - 4800 + Math.floor(m2 / 10);
  return toISODate({ y: y, m: m, d: d });
}

function addDays(iso, days) {
  return fromSerial(toSerial(parseISODate(iso)) + days);
}

function diffCalendarDays(startIso, endIso) {
  return toSerial(parseISODate(endIso)) - toSerial(parseISODate(startIso));
}

function compareDates(a, b) {
  var sa = toSerial(parseISODate(a)), sb = toSerial(parseISODate(b));
  return sa < sb ? -1 : sa > sb ? 1 : 0;
}

function inclusiveCalendarDays(startIso, endIso) {
  return diffCalendarDays(startIso, endIso) + 1;
}

function dayOfWeek(ymd) {
  var serial = toSerial(ymd);
  var diff = ((serial - 2451545) % 7 + 7) % 7; // 0 = سبت
  return (diff + 6) % 7; // 0 = الأحد ... 6 = السبت
}

var WEEKEND_DAYS = { 5: true, 6: true }; // الجمعة والسبت

function isWeekend(iso) {
  return !!WEEKEND_DAYS[dayOfWeek(parseISODate(iso))];
}

function isLeapYear(y) {
  return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
}

function todayInRiyadh() {
  var now = new Date();
  var utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
  var riyadh = new Date(utcMs + 3 * 3600000);
  return toISODate({ y: riyadh.getFullYear(), m: riyadh.getMonth() + 1, d: riyadh.getDate() });
}

function nowInRiyadhISO() {
  var now = new Date();
  var utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
  var r = new Date(utcMs + 3 * 3600000);
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  return r.getFullYear() + "-" + pad(r.getMonth() + 1) + "-" + pad(r.getDate()) +
    "T" + pad(r.getHours()) + ":" + pad(r.getMinutes()) + ":" + pad(r.getSeconds()) + "+03:00";
}

var ARABIC_MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
var ARABIC_WEEKDAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];

function formatArabicDate(iso, withWeekday) {
  var ymd = parseISODate(iso);
  var monthName = ARABIC_MONTHS[ymd.m - 1];
  if (withWeekday === false) return ymd.d + " " + monthName + " " + ymd.y;
  var weekday = ARABIC_WEEKDAYS[dayOfWeek(ymd)];
  return weekday + "، " + ymd.d + " " + monthName + " " + ymd.y;
}

function formatArabicRange(startIso, endIso) {
  return formatArabicDate(startIso, false) + " — " + formatArabicDate(endIso, false);
}

// ================================================================
// سياسة أنواع الإجازات — قابلة للتهيئة من مكان واحد
// ================================================================

var LEAVE_POLICY = {
  paternity: { label: "إجازة الأبوة / ولادة مولود", category: "fixed_calendar", fixedDays: 3, deducts: false },
  marriage: { label: "إجازة الزواج", category: "fixed_calendar", fixedDays: 5, deducts: false },
  maternity: { label: "إجازة الأمومة / الوضع", category: "fixed_calendar", fixedDays: 84, deducts: false },
  death_spouse_asc_desc: { label: "وفاة الزوجة / الأصول / الفروع", category: "fixed_calendar", fixedDays: 5, deducts: false },
  death_sibling: { label: "وفاة الأخ أو الأخت", category: "fixed_calendar", fixedDays: 3, deducts: false },
  death_husband_muslim: { label: "وفاة زوج العاملة المسلمة", category: "fixed_calendar", fixedDays: 130, deducts: false },
  death_husband_non_muslim: { label: "وفاة زوج العاملة غير المسلمة", category: "fixed_calendar", fixedDays: 15, deducts: false },
  annual: { label: "الإجازة السنوية", category: "workdays_excl_weekend_holiday", deducts: true },
  // هل تُخصم الإجازة المرضية من الرصيد؟ NEEDS_CONFIRMATION — راجع قسم الافتراضات في الصفحة
  sick: { label: "الإجازة المرضية", category: "workdays_excl_weekend_holiday", deducts: false },

var LEAVE_TYPE_OPTIONS = Object.keys(LEAVE_POLICY).map(function (k) {
  return { value: k, label: LEAVE_POLICY[k].label };
});

function isFixedLeaveType(type) {
  return LEAVE_POLICY[type].category === "fixed_calendar";
}

// ================================================================
// حساب مدة الإجازة
// ================================================================

function countWorkdays(startIso, endIso, holidaySet) {
  if (compareDates(startIso, endIso) > 0) return 0;
  var count = 0, cursor = startIso, guard = 0;
  while (compareDates(cursor, endIso) <= 0 && guard < 5000) {
    if (!isWeekend(cursor) && !holidaySet[cursor]) count++;
    cursor = addDays(cursor, 1);
    guard++;
  }
  return count;
}

/** يعيد { startDate, endDate, totalDays, endDateReadOnly } أو { error } */
function calculateLeave(params) {
  var leaveType = params.leaveType, startDate = params.startDate, holidaySet = params.holidaySet || {};
  var policy = LEAVE_POLICY[leaveType];

  try { parseISODate(startDate); } catch (e) { return { error: "تاريخ البداية غير صالح." }; }

  if (policy.category === "fixed_calendar") {
    var endDate = addDays(startDate, policy.fixedDays - 1);
    return { startDate: startDate, endDate: endDate, totalDays: policy.fixedDays, endDateReadOnly: true };
  }

  var end = params.endDate;
  if (!end) return { error: "الرجاء تحديد تاريخ النهاية." };
  try { parseISODate(end); } catch (e) { return { error: "تاريخ النهاية غير صالح." }; }
  if (compareDates(end, startDate) < 0) return { error: "تاريخ النهاية يجب أن يكون مساوياً لتاريخ البداية أو بعده." };

  if (policy.category === "workdays_excl_weekend_holiday") {
    var totalDays = countWorkdays(startDate, end, holidaySet);
    if (totalDays <= 0) {
      return { error: "المدة المحددة لا تحتوي على أي يوم عمل فعلي (تقع بالكامل ضمن عطلة نهاية الأسبوع أو إجازة رسمية)." };
    }
    return { startDate: startDate, endDate: end, totalDays: totalDays, endDateReadOnly: false };
  }

  return { startDate: startDate, endDate: end, totalDays: inclusiveCalendarDays(startDate, end), endDateReadOnly: false };
}

function determineInitialStage(requesterRole, leaveType) {
  var isExceptional = EXCEPTIONAL_GM_DIRECT_TYPES.indexOf(leaveType) !== -1;
  var isExecutive = requesterRole === "pm" || requesterRole === "cm";
  if (isExceptional || isExecutive) return "gm";
  return "pm";
}

function determineNextStage(currentStage) {
  if (currentStage === "pm") return "cm";
  if (currentStage === "cm") return "done";
  if (currentStage === "gm") return "done";
  return "done";
}

function canRoleActOnStage(role, stage) {
  if (stage === "done") return false;
  if (role === "co" || role === "employee") return false;
  return role === stage;
}

function stageToStatus(stage) {
  if (stage === "pm") return "pending_pm";
  if (stage === "cm") return "pending_cm";
  if (stage === "gm") return "pending_gm";
  return "approved";
}

function statusToStage(status) {
  if (status === "pending_pm") return "pm";
  if (status === "pending_cm") return "cm";
  if (status === "pending_gm") return "gm";
  return "done";
}

function normalizeEnvelope(raw) {
  if (raw === null || raw === undefined) return { success:false, data:null, message:"استجابة فارغة من الخادم.", errorCode:"EMPTY_RESPONSE" };
  if (typeof raw !== "object") return { success:false, data:null, message:"استجابة غير متوقعة من الخادم.", errorCode:"MALFORMED_RESPONSE" };
  if ("success" in raw) {

  }
  if ("ok" in raw) {
    return { success: !!raw.ok, data: raw.result != null ? raw.result : (raw.data != null ? raw.data : null), message: typeof raw.message === "string" ? raw.message : (typeof raw.error === "string" ? raw.error : ""), errorCode: typeof raw.errorCode === "string" ? raw.errorCode : null };
  }
  if ("error" in raw) {
    return { success:false, data:null, message: typeof raw.error === "string" ? raw.error : "حدث خطأ غير متوقع.", errorCode: typeof raw.errorCode === "string" ? raw.errorCode : "UNKNOWN_ERROR" };
  }
  return { success:true, data: raw, message:"", errorCode:null };
}

function callAppsScript(action, payload) {
  var controller = new AbortController();
  var timeoutId = setTimeout(function () { controller.abort(); }, REQUEST_TIMEOUT_MS);
  var body = Object.assign({ action: action, sessionToken: currentSessionToken() }, payload || {});

  return fetch(SETTINGS.appsScriptUrl, {
    method: "POST", mode: "cors",
    // ملاحظة: نستخدم text/plain عمداً بدل application/json لتفادي CORS
    // preflight (OPTIONS) الذي لا تتعامل معه Apps Script Web Apps بشكل موثوق
    // دائماً. الجسم يبقى نص JSON صالحاً تماماً ويُقرأ في Code.gs كما هو.
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body),
    signal: controller.signal
  }).catch(function (err) {
    clearTimeout(timeoutId);
    if (err && err.name === "AbortError") throw new ApiClientError("انتهت مهلة الاتصال بالخادم. حاول مرة أخرى.", "TIMEOUT");
    throw new ApiClientError("تعذر الاتصال بالخادم. تحقق من الاتصال وحاول مرة أخرى.", "NETWORK_ERROR");
  }).then(function (response) {
    clearTimeout(timeoutId);
    if (!response.ok) throw new ApiClientError("تعذر إتمام الطلب (رمز الخطأ " + response.status + "). حاول مرة أخرى لاحقاً.", "HTTP_ERROR");
    return response.text();
  }).then(function (text) {
    if (!text) throw new ApiClientError("استجابة فارغة من الخادم.", "EMPTY_RESPONSE");
    var json;
    try { json = JSON.parse(text); } catch (e) { throw new ApiClientError("تعذّرت قراءة استجابة الخادم.", "MALFORMED_RESPONSE"); }
    var envelope = normalizeEnvelope(json);
    if (!envelope.success) {
      if (envelope.errorCode === "SESSION_EXPIRED" || envelope.errorCode === "UNAUTHENTICATED") {
        clearSession();
        onSessionExpired && onSessionExpired();
      }
      throw new ApiClientError(envelope.message || "حدث خطأ غير متوقع.", envelope.errorCode || "UNKNOWN_ERROR");
    }
    if (envelope.data === null) throw new ApiClientError("لم يُعثر على بيانات في استجابة الخادم.", "NO_DATA");
    return envelope.data;
  });
}

function runMock(fn) {
  try {
    return Promise.resolve(fn());
  } catch (err) {
    if (err instanceof ApiClientError && (err.code === "SESSION_EXPIRED" || err.code === "UNAUTHENTICATED")) {
      clearSession();
      onSessionExpired && onSessionExpired();
    }
    return Promise.reject(err instanceof ApiClientError ? err : new ApiClientError(err.message || "حدث خطأ غير متوقع.", "UNKNOWN_ERROR"));
  }
}

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, function (c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}

function showToast(kind, message) {
  var host = el("toast-host");

  setTimeout(function () { div.remove(); }, 4500);
}

function attachLoginHandlers() {
  var form = el("login-form");
  if (form) {
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var nid = el("f-nid").value.trim();
      var pass = el("f-pass").value;
      if (!nid || !pass) return;
      handleLoginSubmit(nid, pass);
    });
  }
}

function handleLoginSubmit(nid, pass) {
  loginState.isLoggingIn = true;
  loginState.error = null;
  render();
  api.login({ nationalId: nid, password: pass }).then(function (result) {
    App.employee = result.employee;
    saveSession({ employee: result.employee, sessionToken: result.sessionToken, loginAt: new Date().toISOString() });
    loginState.isLoggingIn = false;
    render();
    if (result.mustChangePassword) {
      ChangePasswordModal.open({ forced: true });
    }
  }).catch(function (err) {
    loginState.isLoggingIn = false;
    loginState.error = err instanceof ApiClientError ? err.message : "تعذر الاتصال بالخادم. تحقق من الاتصال وحاول مرة أخرى.";
    render();
  });
}

function saveSettingsFromForm() {
  var url = el("s-url").value.trim();
  var useMock = el("s-mock").checked;
  SETTINGS = { appsScriptUrl: url, useMock: useMock };
  saveSettings(SETTINGS);
  holidaysCache = null;
  showToast("success", "تم حفظ الإعدادات.");
  render();
}

function renderRequestsTable(requests, opts) {

function applyClientFilters(items, filters) {
  return items.filter(function (item) {
    if (filters.query) {
      var q = filters.query.trim().toLowerCase();
      var matches = item.employeeName.toLowerCase().indexOf(q) !== -1 || item.nationalId.indexOf(q) !== -1 || item.requestId.toLowerCase().indexOf(q) !== -1;
      if (!matches) return false;
    }
    if (filters.city && item.city && item.city !== filters.city) return false;
    if (filters.leaveType !== "all" && item.leaveType !== filters.leaveType) return false;
    if (filters.status !== "all" && item.status !== filters.status) return false;
    return true;
  });
}

function renderPagination(idPrefix, page, pageSize, total) {
  var totalPages = Math.max(1, Math.ceil(total / pageSize));
  if (totalPages <= 1) return "";
  return '<div class="pagination-row"><span>صفحة ' + page + ' من ' + totalPages + ' — ' + total + ' نتيجة</span>' +
    '<div style="display:flex;gap:6px;">' +
      '<button class="btn btn-secondary btn-sm" ' + (page <= 1 ? "disabled" : "") + ' onclick="' + idPrefix + 'PageChange(' + (page - 1) + ')">السابق</button>' +
      '<button class="btn btn-secondary btn-sm" ' + (page >= totalPages ? "disabled" : "") + ' onclick="' + idPrefix + 'PageChange(' + (page + 1) + ')">التالي</button>' +
    '</div></div>';
}

// ================================================================
// نظام النوافذ المنبثقة (Modal) العام
// ================================================================

function openModal(modalState) {
  App.modal = modalState;
  renderModalIfAny();
}
function closeModal(force) {
  if (App.modal && App.modal.nonDismissable && !force) return; // نافذة إلزامية — لا تُغلق إلا بعد إتمام المطلوب
  App.modal = null;
  var host = el("modal-host");
  if (host) host.remove();
}

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && App.modal) closeModal();
});

function modalShell(title, bodyHtml, footHtml, size, nonDismissable) {
  return '<div class="overlay" id="modal-host" ' + (nonDismissable ? "" : 'onmousedown="if(event.target===this) closeModal();"') + '>' +
    '<div class="modal ' + (size === "lg" ? "lg" : "") + '">' +
      '<div class="modal-head"><h2>' + escapeHtml(title) + '</h2>' +
      (nonDismissable ? "" : '<button class="modal-close" onclick="closeModal()" aria-label="إغلاق">✕</button>') +
      '</div>' +
      '<div class="modal-body">' + bodyHtml + '</div>' +
      (footHtml ? '<div class="modal-foot">' + footHtml + '</div>' : '') +
    '</div>' +
  '</div>';
}

function renderModalIfAny() {
  var existing = el("modal-host");
  if (existing) existing.remove();
  if (!App.modal) return;
  var html = "";
  if (App.modal.type === "leaveForm") html = LeaveFormModal.render();
  else if (App.modal.type === "approval") html = ApprovalModal.render();
  else if (App.modal.type === "employeeHistory") html = EmployeeHistoryModal.render();
  else if (App.modal.type === "changePassword") html = ChangePasswordModal.render();
  else if (App.modal.type === "permissionForm") html = PermissionFormModal.render();
  else if (App.modal.type === "signatureUpload") html = SignatureUploadModal.render();
  if (!html) return;
  document.body.insertAdjacentHTML("beforeend", html);
  if (App.modal.type === "leaveForm") LeaveFormModal.afterRender();
}

var LeaveFormModal = {
  holidaySet: {},
  isLoadingHolidays: true,
  colleagues: null, // null = لم تُحمّل بعد
  isSubmitting: false,
  touched: false,

  open: function () {
    LeaveFormModal.isSubmitting = false;
    LeaveFormModal.touched = false;
    LeaveFormModal.isLoadingHolidays = true;
    LeaveFormModal.colleagues = null;
    openModal({ type: "leaveForm" });
    getHolidaySetCached().then(function (set) {
      LeaveFormModal.holidaySet = set;
      LeaveFormModal.isLoadingHolidays = false;
      if (App.modal && App.modal.type === "leaveForm") LeaveFormModal.recalc();
    });
    api.getEmployees().then(function (list) {
      LeaveFormModal.colleagues = list;
      if (App.modal && App.modal.type === "leaveForm") LeaveFormModal.renderSubstituteField();
    }).catch(function () {
      LeaveFormModal.colleagues = [];
      if (App.modal && App.modal.type === "leaveForm") LeaveFormModal.renderSubstituteField();
    });
  },

  render: function () {
    var typeOptions = LEAVE_TYPE_OPTIONS.map(function (o) { return '<option value="' + o.value + '">' + o.label + '</option>'; }).join("");
    var body = '' +
      '<div class="field"><label for="lf-type">نوع الإجازة <span class="req">*</span></label>' +
        '<select id="lf-type" onchange="LeaveFormModal.onTypeChange()">' + typeOptions + '</select></div>' +
      '<div class="form-row-2">' +
        '<div class="field"><label for="lf-start">تاريخ البداية <span class="req">*</span></label>' +
          '<input id="lf-start" type="date" value="' + todayInRiyadh() + '" oninput="LeaveFormModal.recalc()" /></div>' +
        '<div class="field"><label for="lf-end">تاريخ النهاية</label>' +
          '<input id="lf-end" type="date" oninput="LeaveFormModal.recalc()" />' +
          '<span class="hint" id="lf-end-hint"></span></div>' +
      '</div>' +
      '<div class="calc-box" id="lf-calc-box">حدد التواريخ لعرض عدد الأيام تلقائياً.</div>' +
      '<div class="field"><label for="lf-sub">اسم البديل <span class="req">*</span></label>' +
        '<select id="lf-sub" disabled><option value="">جارٍ تحميل قائمة الزملاء...</option></select>' +
        '<span class="err" id="lf-sub-err"></span></div>' +
      '<div class="field"><label for="lf-reason">السبب <span class="req">*</span></label><textarea id="lf-reason" placeholder="اذكر سبب طلب الإجازة"></textarea><span class="err" id="lf-reason-err"></span></div>' +
      '<button class="btn btn-primary btn-block" id="lf-submit" onclick="LeaveFormModal.submit()">إرسال الطلب</button>';
    return modalShell("طلب إجازة جديد", body, null, "md");
  },

  afterRender: function () {
    LeaveFormModal.recalc();
    LeaveFormModal.renderSubstituteField();
  },

  /** يستبدل حقل البديل بقائمة منسدلة (أسماء زملاء نفس الشركة) بمجرد توفرها،
   * أو بحقل نصي احتياطي إذا فشل التحميل أو كانت القائمة فارغة — دون إعادة
   * رسم بقية النافذة (فلا تُفقد القيم التي أدخلها المستخدم في حقول أخرى). */
  renderSubstituteField: function () {
    var subEl = el("lf-sub");
    if (!subEl) return;
    var list = LeaveFormModal.colleagues;
    if (list === null) return; // لم تصل البيانات بعد
    if (list.length > 0) {
      var options = '<option value="" disabled selected>اختر الموظف البديل</option>' +
        list.map(function (c) { return '<option value="' + escapeHtml(c.nationalId) + '">' + escapeHtml(c.name) + '</option>'; }).join("");
      subEl.outerHTML = '<select id="lf-sub">' + options + '</select>';
    } else {
      subEl.outerHTML = '<input id="lf-sub" placeholder="اسم الموظف البديل أثناء الإجازة" />';
    }
  },

  onTypeChange: function () {
    el("lf-end").value = "";
    LeaveFormModal.touched = false;
    LeaveFormModal.recalc();
  },

  currentCalculation: null,

  recalc: function () {
    var type = el("lf-type") ? el("lf-type").value : "annual";
    var start = el("lf-start") ? el("lf-start").value : "";
    var endInput = el("lf-end");
    var fixed = isFixedLeaveType(type);
    endInput.disabled = fixed;

    var box = el("lf-calc-box");
    if (LeaveFormModal.isLoadingHolidays && !fixed) {
      box.textContent = "جارٍ تحميل تقويم الإجازات الرسمية...";
      LeaveFormModal.currentCalculation = null;
      return;
    }
    if (!start || (!fixed && !endInput.value)) {
      box.textContent = "حدد التواريخ لعرض عدد الأيام تلقائياً.";
      LeaveFormModal.currentCalculation = null;
      return;
    }
    var result = calculateLeave({ leaveType: type, startDate: start, endDate: fixed ? undefined : endInput.value, holidaySet: LeaveFormModal.holidaySet });
    if (result.error) {
      box.innerHTML = '<strong style="color:var(--rejected);">' + escapeHtml(result.error) + '</strong>';
      LeaveFormModal.currentCalculation = null;
      return;
    }
    if (fixed) endInput.value = result.endDate;
    el("lf-end-hint").textContent = fixed ? "يُحسب تلقائياً حسب نوع الإجازة" : "";
    box.innerHTML = '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;"><span>' + formatArabicRange(result.startDate, result.endDate) + '</span><strong>إجمالي الأيام: ' + result.totalDays + '</strong></div>';
    LeaveFormModal.currentCalculation = result;
  },

  submit: function () {
    LeaveFormModal.touched = true;
    var subEl = el("lf-sub");
    var subName = "", subNationalId = "";
    if (subEl.tagName === "SELECT") {
      subNationalId = subEl.value.trim();
      var selectedOption = subEl.options[subEl.selectedIndex];
      subName = selectedOption ? selectedOption.text : "";
    } else {
      subName = subEl.value.trim();
    }
    var reason = el("lf-reason").value.trim();
    el("lf-sub-err").textContent = subName ? "" : "هذا الحقل مطلوب.";
    el("lf-reason-err").textContent = reason ? "" : "هذا الحقل مطلوب.";

    var calc = LeaveFormModal.currentCalculation;
    if (!calc || !subName || !reason) return;

    var type = el("lf-type").value;
    var policy = LEAVE_POLICY[type];
    if (policy.deducts && App.employee.currentBalance !== undefined && App.employee.currentBalance < calc.totalDays) {
      showToast("error", "الرصيد الحالي لا يكفي لهذه المدة.");
      return;
    }

    LeaveFormModal.isSubmitting = true;
    var btn = el("lf-submit");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> جارٍ الإرسال...';

    api.submitLeave({
      nationalId: App.employee.nationalId,
      leaveType: type,
      startDate: calc.startDate,
      endDate: calc.endDate,
      totalDays: calc.totalDays,
      substituteName: subName,
      substituteNationalId: subNationalId,
      reason: reason
    }).then(function () {
      showToast("success", "تم إرسال الطلب بنجاح.");
      closeModal();
      if (typeof EmployeeDashboard !== "undefined") EmployeeDashboard.reload();
    }).catch(function (err) {
      showToast("error", err instanceof ApiClientError ? err.message : "تعذر إرسال الطلب.");
      LeaveFormModal.isSubmitting = false;
      btn.disabled = false;
      btn.textContent = "إرسال الطلب";
      // لا نغلق النافذة ولا نمسح القيم المُدخلة عند الفشل
    });
  }
};

var ApprovalModal = {
  open: function (request, action, onSuccessFn) {
    openModal({ type: "approval", request: request, action: action, onSuccessFn: onSuccessFn, isSubmitting: false });
  },

  render: function () {
    var m = App.modal, r = m.request, isReject = m.action === "rejected";
    var body = '' +
      '<div class="req-summary-box">' +
        '<div class="flex-between" style="margin-bottom:8px;"><strong>' + escapeHtml(r.employeeName) + '</strong><span class="muted">' + r.requestId + '</span></div>' +
        '<dl>' +
          '<dt>نوع الإجازة</dt><dd>' + LEAVE_POLICY[r.leaveType].label + '</dd>' +
          '<dt>الفترة</dt><dd>' + formatArabicRange(r.startDate, r.endDate) + '</dd>' +
          '<dt>عدد الأيام</dt><dd>' + r.totalDays + '</dd>' +
          '<dt>البديل</dt><dd>' + escapeHtml(r.substituteName || "—") + '</dd>' +
          '<dt>السبب</dt><dd>' + escapeHtml(r.reason || "—") + '</dd>' +
        '</dl>' +
      '</div>' +
      '<div class="field"><label for="am-comment">التعليق' + (isReject ? ' <span class="req">*</span>' : '') + '</label>' +
        '<textarea id="am-comment" placeholder="' + (isReject ? "اذكر سبب الرفض (إلزامي)" : "تعليق اختياري") + '"></textarea>' +
        (!isReject ? '<span class="hint">اختياري</span>' : '<span class="err" id="am-comment-err"></span>') +
      '</div>';
    var foot = '<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>' +
      '<button class="btn ' + (isReject ? "btn-danger" : "btn-primary") + '" id="am-confirm" onclick="ApprovalModal.confirm()">' + (isReject ? "تأكيد الرفض" : "تأكيد الاعتماد") + '</button>';
    return modalShell(isReject ? "تأكيد رفض الطلب" : "تأكيد اعتماد الطلب", body, foot, "md");
  },

  confirm: function () {
    var m = App.modal;
    var comment = el("am-comment").value.trim();
    if (m.action === "rejected" && !comment) {
      el("am-comment-err").textContent = "التعليق إلزامي عند الرفض.";
      return;
    }
    var btn = el("am-confirm");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> جارٍ التنفيذ...';

    api.updateStatus({ requestId: m.request.requestId, status: m.action, comment: comment }).then(function () {
      showToast("success", m.action === "approved" ? "تم اعتماد الطلب بنجاح." : "تم رفض الطلب.");
      var onSuccessFn = m.onSuccessFn;
      closeModal();
      if (onSuccessFn && window[onSuccessFn]) window[onSuccessFn]();
    }).catch(function (err) {
      showToast("error", err instanceof ApiClientError ? err.message : "تعذر تنفيذ الإجراء.");
      btn.disabled = false;
      btn.textContent = m.action === "rejected" ? "تأكيد الرفض" : "تأكيد الاعتماد";
    });
  }
};

var EmployeeHistoryModal = {
  nationalId: null,
  loading: true,
  error: null,
  data: null,

  open: function (nationalId) {
    EmployeeHistoryModal.nationalId = nationalId;
    EmployeeHistoryModal.loading = true;
    EmployeeHistoryModal.error = null;
    EmployeeHistoryModal.data = null;
    openModal({ type: "employeeHistory" });
    EmployeeHistoryModal.load();
  },

  load: function () {
    EmployeeHistoryModal.loading = true;
    EmployeeHistoryModal.error = null;
    renderModalIfAny();
    api.getEmployeeHistory(EmployeeHistoryModal.nationalId).then(function (result) {
      EmployeeHistoryModal.data = result;
      EmployeeHistoryModal.loading = false;
      renderModalIfAny();
    }).catch(function (err) {
      EmployeeHistoryModal.error = err instanceof ApiClientError ? err.message : "تعذر تحميل سجل الموظف.";
      EmployeeHistoryModal.loading = false;
      renderModalIfAny(); // لا نغلق النافذة تلقائياً عند فشل التحميل
    });
  },

  render: function () {
    var body;
    if (EmployeeHistoryModal.loading) {
      body = renderCenterLoading("جارٍ تحميل سجل الموظف...");
    } else if (EmployeeHistoryModal.error) {
      body = renderErrorState(EmployeeHistoryModal.error, "EmployeeHistoryModal.load");
    } else {
      var d = EmployeeHistoryModal.data;
      var infoGrid = '<div class="info-grid">' +
        '<div><span class="k">الاسم</span><span class="v">' + escapeHtml(d.employee.name) + '</span></div>' +
        '<div><span class="k">رقم الهوية</span><span class="v">' + escapeHtml(d.employee.nationalId) + '</span></div>' +
        '<div><span class="k">القسم</span><span class="v">' + escapeHtml(d.employee.department) + '</span></div>' +
        '<div><span class="k">المدينة</span><span class="v">' + escapeHtml(d.employee.city) + '</span></div>' +
        (d.employee.currentBalance !== undefined ? '<div><span class="k">الرصيد الحالي</span><span class="v">' + d.employee.currentBalance + '</span></div>' : '') +
        (d.employee.initialBalance !== undefined ? '<div><span class="k">الرصيد الابتدائي</span><span class="v">' + d.employee.initialBalance + '</span></div>' : '') +
      '</div>';
      var list = d.requests.length === 0
        ? '<p class="muted" style="margin-top:10px;">لا يوجد سجل طلبات لهذا الموظف.</p>'
        : '<div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">' +
            d.requests.map(function (r) {
              return '<div class="flex-between" style="border:1px solid var(--mist);border-radius:var(--radius-ctl);padding:9px 12px;font-size:13.5px;">' +
                '<strong>' + LEAVE_POLICY[r.leaveType].label + '</strong>' +
                '<span class="muted">' + formatArabicRange(r.startDate, r.endDate) + '</span>' +
                '<span class="muted">' + r.totalDays + ' يوم</span>' +
                renderStatusBadge(r.status) +
              '</div>';
            }).join("") +
          '</div>';
      body = infoGrid + '<h3 style="font-size:13.5px;color:var(--navy);margin:16px 0 4px;">سجل الطلبات</h3>' + list;

      var permissions = d.permissions || [];
      var permList = permissions.length === 0
        ? '<p class="muted" style="margin-top:10px;">لا يوجد استئذانات مسجَّلة لهذا الموظف.</p>'
        : '<div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">' +
            permissions.map(function (p) {
              return '<div class="flex-between" style="border:1px solid var(--mist);border-radius:var(--radius-ctl);padding:9px 12px;font-size:13.5px;">' +
                '<strong>' + formatArabicDate(p.date, false) + '</strong>' +
                '<span class="muted">' + escapeHtml(p.fromTime) + ' — ' + escapeHtml(p.toTime) + '</span>' +
                '<span class="muted">' + escapeHtml(p.reason) + '</span>' +
                '<button class="btn btn-secondary btn-sm" onclick=\'downloadPermissionCertificate(' + JSON.stringify(p.id) + ', this)\'>PDF</button>' +
              '</div>';
            }).join("") +
          '</div>';
      body += '<h3 style="font-size:13.5px;color:var(--navy);margin:20px 0 4px;">سجل الاستئذانات</h3>' + permList;
    }
    return modalShell("ملخص الموظف", body, null, "lg");
  }
};

var PermissionFormModal = {
  isSubmitting: false,

  open: function () {
    PermissionFormModal.isSubmitting = false;
    openModal({ type: "permissionForm" });
  },

  render: function () {
    var body = '' +
      '<p style="font-size:12.5px;color:var(--muted);margin:0 0 14px;">طلب الاستئذان يُسجَّل مباشرة في سجلك دون الحاجة لأي اعتماد.</p>' +
      '<div class="field"><label for="pf-date">التاريخ <span class="req">*</span></label><input id="pf-date" type="date" value="' + todayInRiyadh() + '" /></div>' +
      '<div class="form-row-2">' +
        '<div class="field"><label for="pf-from">من الساعة <span class="req">*</span></label><input id="pf-from" type="time" /></div>' +
        '<div class="field"><label for="pf-to">إلى الساعة <span class="req">*</span></label><input id="pf-to" type="time" /></div>' +
      '</div>' +
      '<div class="field"><label for="pf-reason">السبب <span class="req">*</span></label><textarea id="pf-reason" placeholder="اذكر سبب الاستئذان"></textarea><span class="err" id="pf-reason-err"></span></div>' +
      '<button class="btn btn-primary btn-block" id="pf-submit" onclick="PermissionFormModal.submit()">تسجيل الاستئذان</button>';
    return modalShell("طلب استئذان", body, null, "sm");
  },

  submit: function () {
    var date = el("pf-date").value;
    var from = el("pf-from").value;
    var to = el("pf-to").value;
    var reason = el("pf-reason").value.trim();
    var err = el("pf-reason-err");
    err.textContent = "";

    if (!date || !from || !to) { err.textContent = "الرجاء تعبئة التاريخ والوقت."; return; }
    if (!reason) { err.textContent = "سبب الاستئذان مطلوب."; return; }
    if (to <= from) { err.textContent = "وقت النهاية يجب أن يكون بعد وقت البداية."; return; }

    var btn = el("pf-submit");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> جارٍ الإرسال...';

    api.submitPermission({ date: date, fromTime: from, toTime: to, reason: reason }).then(function () {
      showToast("success", "تم تسجيل الاستئذان بنجاح.");
      closeModal();
      if (typeof EmployeeDashboard !== "undefined") EmployeeDashboard.reloadPermissions();
    }).catch(function (err2) {
      showToast("error", err2 instanceof ApiClientError ? err2.message : "تعذر تسجيل الاستئذان.");
      btn.disabled = false;
      btn.textContent = "تسجيل الاستئذان";
    });
  }
};

var SignatureUploadModal = {
  isSubmitting: false,
  previewSrc: null,

  open: function () {
    SignatureUploadModal.isSubmitting = false;
    SignatureUploadModal.previewSrc = null;
    openModal({ type: "signatureUpload" });
  },

  render: function () {
    var preview = SignatureUploadModal.previewSrc
      ? '<div style="text-align:center;margin-bottom:14px;"><img src="' + SignatureUploadModal.previewSrc + '" style="max-height:80px;border:1px solid var(--mist);border-radius:8px;padding:6px;background:#fff;" /></div>'
      : "";
    var body = '' +
      '<p style="font-size:12.5px;color:var(--muted);margin:0 0 14px;">يظهر توقيعك تلقائياً في نماذج اعتماد الإجازة التي توافق عليها أنت شخصياً. يُفضّل صورة PNG بخلفية شفافة وحجم صغير.</p>' +
      preview +
      '<div class="field"><label for="sig-file">اختر صورة التوقيع</label><input id="sig-file" type="file" accept="image/png,image/jpeg" onchange="SignatureUploadModal.onFileChange()" /></div>' +
      '<p class="err" id="sig-err" style="min-height:16px;"></p>' +
      '<button class="btn btn-primary btn-block" id="sig-submit" onclick="SignatureUploadModal.submit()" disabled>رفع التوقيع</button>';
    return modalShell("رفع التوقيع", body, null, "sm");
  },

  onFileChange: function () {
    var input = el("sig-file");
    var errBox = el("sig-err");
    errBox.textContent = "";
    var file = input.files && input.files[0];
    if (!file) return;
    if (file.size > 300 * 1024) {
      errBox.textContent = "حجم الصورة كبير جداً. الرجاء اختيار صورة أصغر من 300 كيلوبايت.";
      input.value = "";
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      SignatureUploadModal.previewSrc = reader.result;
      renderModalIfAny();
      var btn = el("sig-submit");
      if (btn) btn.disabled = false;
    };
    reader.onerror = function () {
      errBox.textContent = "تعذرت قراءة الملف. حاولي مرة أخرى.";
    };

var ChangePasswordModal = {
  open: function (opts) {
    opts = opts || {};
    openModal({ type: "changePassword", forced: !!opts.forced, nonDismissable: !!opts.forced, isSubmitting: false });
  },

  render: function () {
    var forced = App.modal.forced;
    var intro = forced
      ? '<p style="font-size:13px;color:var(--muted);margin:0 0 14px;">هذا أول تسجيل دخول لك بكلمة مرور افتراضية. لأمان حسابك، الرجاء تعيين كلمة مرور خاصة بك قبل المتابعة.</p>'
      : "";
    var body = intro +
      '<div class="field"><label for="cp-current">كلمة المرور الحالية <span class="req">*</span></label><input id="cp-current" type="password" autocomplete="current-password" /></div>' +
      '<div class="field"><label for="cp-new">كلمة المرور الجديدة <span class="req">*</span></label><input id="cp-new" type="password" autocomplete="new-password" /><span class="hint">6 أحرف على الأقل</span></div>' +
      '<div class="field"><label for="cp-confirm">تأكيد كلمة المرور الجديدة <span class="req">*</span></label><input id="cp-confirm" type="password" autocomplete="new-password" /></div>' +
      '<p class="err" id="cp-err" style="min-height:16px;"></p>';
    var foot = (forced ? "" : '<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>') +
      '<button class="btn btn-primary" id="cp-submit" onclick="ChangePasswordModal.submit()">حفظ كلمة المرور الجديدة</button>';
    return modalShell("تغيير كلمة المرور", body, foot, "sm", App.modal.nonDismissable);
  },

  submit: function () {
    var current = el("cp-current").value;
    var next = el("cp-new").value;
    var confirm = el("cp-confirm").value;
    var errBox = el("cp-err");

    if (!current || !next || !confirm) { errBox.textContent = "الرجاء تعبئة كل الحقول."; return; }
    if (next.length < 6) { errBox.textContent = "كلمة المرور الجديدة يجب أن تتكون من 6 أحرف على الأقل."; return; }
    if (next !== confirm) { errBox.textContent = "كلمة المرور الجديدة وتأكيدها غير متطابقين."; return; }
    errBox.textContent = "";

    var btn = el("cp-submit");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> جارٍ الحفظ...';

    api.changePassword({ currentPassword: current, newPassword: next }).then(function () {
      showToast("success", "تم تغيير كلمة المرور بنجاح.");
      closeModal(true); // إغلاق قسري حتى لو كانت النافذة إلزامية — تمت المطلوب منها
    }).catch(function (err) {
      errBox.textContent = err instanceof ApiClientError ? err.message : "تعذر تغيير كلمة المرور.";
      btn.disabled = false;
      btn.textContent = "حفظ كلمة المرور الجديدة";
    });
  }
};

function renderMyPermissionsTable(permissions) {
  if (permissions.length === 0) return renderEmptyState("لا يوجد استئذانات مسجَّلة", "استخدم زر «طلب استئذان» لتسجيل أول استئذان.");
  var rows = permissions.map(function (p) {
    return '<tr>' +
      '<td>' + formatArabicDate(p.date, false) + '</td>' +
      '<td>' + escapeHtml(p.fromTime) + ' — ' + escapeHtml(p.toTime) + '</td>' +
      '<td>' + escapeHtml(p.reason) + '</td>' +
      '<td class="muted">' + formatArabicDate(p.timestamp.slice(0, 10), false) + '</td>' +
      '<td><button class="btn btn-secondary btn-sm" onclick=\'downloadPermissionCertificate(' + JSON.stringify(p.id) + ', this)\'>تحميل PDF</button></td>' +
    '</tr>';
  }).join("");
  return '<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الوقت</th><th>السبب</th><th>تاريخ التسجيل</th><th>التقرير</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function renderMyRequestsTable(requests) {
  if (requests.length === 0) return renderEmptyState("لا توجد طلبات إجازة بعد", "استخدم زر «طلب إجازة» لإنشاء طلبك الأول.");
  var rows = requests.map(function (r) {
    var comments = "";
    if (r.pmComment) comments += "<p>مدير المشروع: " + escapeHtml(r.pmComment) + "</p>";
    if (r.cmComment) comments += "<p>مدير العقد / المدير العام: " + escapeHtml(r.cmComment) + "</p>";
    if (!comments) comments = "—";
    var stageNote = (r.status !== "approved" && r.status !== "rejected" && r.status !== "cancelled")
      ? '<div class="muted">' + STAGE_LABELS[statusToStage(r.status)] + '</div>' : "";
    var reportCell = r.status === "approved"
      ? '<button class="btn btn-secondary btn-sm" onclick="downloadCertificate(' + JSON.stringify(r.requestId) + ', this)">تحميل PDF</button>'
      : '<span class="muted">—</span>';
    return '<tr>' +
      '<td>' + LEAVE_POLICY[r.leaveType].label + '</td>' +
      '<td>' + formatArabicRange(r.startDate, r.endDate) + '</td>' +
      '<td>' + r.totalDays + '</td>' +
      '<td>' + renderStatusBadge(r.status) + stageNote + '</td>' +
      '<td style="max-width:220px;font-size:12px;">' + comments + '</td>' +
      '<td class="muted">' + formatArabicDate(r.timestamp.slice(0, 10), false) + '</td>' +
      '<td>' + reportCell + '</td>' +
    '</tr>';
  }).join("");
  return '<div class="table-wrap"><table><thead><tr><th>نوع الإجازة</th><th>الفترة</th><th>الأيام</th><th>الحالة</th><th>التعليقات</th><th>تاريخ الطلب</th><th>التقرير</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

var PermissionsReportTab = {

    };
    PermissionsReportTab.load(idPrefix);
    window[idPrefix + "PermFilterChanged"] = function () {
      var inst = PermissionsReportTab.instances[idPrefix];
      inst.filters = {
        query: el(idPrefix + "-perm-query") ? el(idPrefix + "-perm-query").value : "",
        dateFrom: el(idPrefix + "-perm-from") ? el(idPrefix + "-perm-from").value : "",
        dateTo: el(idPrefix + "-perm-to") ? el(idPrefix + "-perm-to").value : ""
      };
      PermissionsReportTab.load(idPrefix);

      query: inst.filters.query || undefined,

      '<div class="field" style="margin:0;"><label for="' + idPrefix + '-perm-query">بحث بالاسم أو رقم الهوية</label>' +

      '<div class="field" style="margin:0;"><label for="' + idPrefix + '-perm-from">من تاريخ</label>' +

      '<div class="field" style="margin:0;"><label for="' + idPrefix + '-perm-to">إلى تاريخ</label>' +

      body = renderRequestsTable(inst.result.items, {}) + renderPagination(idPrefix, inst.result.page, inst.result.pageSize, inst.result.total);
    }
    inst.target.innerHTML = renderFilterBar(idPrefix, inst.filters, inst.cities) + exportBtn + body;
  }
};

function downloadPdfFromBase64_(result, fallbackFilename) {
  var byteChars = atob(result.base64);
  var byteNumbers = new Array(byteChars.length);
  for (var i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
  var blob = new Blob([new Uint8Array(byteNumbers)], { type: "application/pdf" });
  var url = URL.createObjectURL(blob);
  var link = document.createElement("a");
  link.href = url; link.download = result.filename || fallbackFilename;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

function downloadCertificate(requestId, btn) {
  var originalHtml = btn ? btn.innerHTML : null;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner spinner-dark"></span>'; }
  api.generateLeaveCertificate(requestId).then(function (result) {
    downloadPdfFromBase64_(result, "leave-certificate-" + requestId + ".pdf");
    showToast("success", "تم تحميل التقرير.");
  }).catch(function (err) {
    showToast("error", err instanceof ApiClientError ? err.message : "تعذر توليد التقرير.");
  }).finally(function () {
    if (btn) { btn.disabled = false; btn.innerHTML = originalHtml; }
  });
}

function downloadPermissionCertificate(id, btn) {

function downloadRequestsCsv(requests) {
  var columns = [
    ["requestId","رقم الطلب"], ["nationalId","رقم الهوية"], ["employeeName","اسم الموظف"],
    ["company","الشركة"], ["department","القسم"], ["city","المدينة"],
    ["leaveTypeLabel","نوع الإجازة"], ["startDate","تاريخ البداية"], ["endDate","تاريخ النهاية"],
    ["totalDays","عدد الأيام"], ["statusLabel","الحالة"], ["pmComment","تعليق مدير المشروع"],
    ["cmComment","تعليق مدير العقد / المدير العام"], ["timestamp","تاريخ الطلب"], ["finalApprovalDate","تاريخ الاعتماد النهائي"]
  ];
  function esc(v) {
    var s = v === undefined || v === null ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  var header = columns.map(function (c) { return esc(c[1]); }).join(",");
  var rows = requests.map(function (r) {
    var withLabels = Object.assign({}, r, { leaveTypeLabel: LEAVE_POLICY[r.leaveType].label, statusLabel: STATUS_LABELS[r.status] });
    return columns.map(function (c) { return esc(withLabels[c[0]]); }).join(",");
  });
  var csv = "\uFEFF" + [header].concat(rows).join("\r\n");
  var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var link = document.createElement("a");
  link.href = url; link.download = "leave-requests-export.csv";
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

// ================================================================
// اللوحة التنفيذية للمدير العام (GM)
// ================================================================

var GMDashboard = {
  tab: "queue",
  requests: [],
  isLoading: true,
  error: null,
  filters: { query: "", city: "", leaveType: "all", status: "all" },

  mount: function (target) {
    GMDashboard.target = target;
    GMDashboard.tab = "queue";
    GMDashboard.filters = { query: "", city: "", leaveType: "all", status: "all" };
    GMDashboard.load();
  },

  load: function () {
    GMDashboard.isLoading = true; GMDashboard.error = null;
    GMDashboard.renderInto();
    api.getRequests().then(function (data) {
      GMDashboard.requests = data; GMDashboard.isLoading = false; GMDashboard.renderInto();
    }).catch(function (err) {
      GMDashboard.error = err instanceof ApiClientError ? err.message : "تعذر تحميل الطلبات.";
      GMDashboard.isLoading = false; GMDashboard.renderInto();
    });
  },

  reload: function () { GMDashboard.load(); },
  setTab: function (tab) { GMDashboard.tab = tab; GMDashboard.renderInto(); },

  cities: function () {
    var set = {};
    GMDashboard.requests.forEach(function (r) { if (r.city) set[r.city] = true; });
    return Object.keys(set);
  },

  gmQueue: function () {
    return GMDashboard.requests.filter(function (r) { return statusToStage(r.status) === "gm"; });
  },

  canAct: function (r) { return canRoleActOnStage("gm", statusToStage(r.status)); },
  approve: function (id) { var r = GMDashboard.requests.filter(function (x) { return x.requestId === id; })[0]; if (r) ApprovalModal.open(r, "approved", "GMDashboard.reload"); },
  reject: function (id) { var r = GMDashboard.requests.filter(function (x) { return x.requestId === id; })[0]; if (r) ApprovalModal.open(r, "rejected", "GMDashboard.reload"); },

  renderInto: function () {
    if (!App.employee) return; // تجاهل استجابة وصلت متأخرة بعد تسجيل الخروج أو التنقل بعيداً
    var tabsHtml = '<div class="flex-between" style="margin-bottom:18px;">' +
      '<h1 class="page-title">اللوحة التنفيذية — المدير العام</h1>' +
      '<div class="segmented">' +
        '<button class="tab-btn ' + (GMDashboard.tab === "queue" ? "active" : "") + '" onclick="GMDashboard.setTab(\'queue\')">طلبات المسار المباشر</button>' +
        '<button class="tab-btn ' + (GMDashboard.tab === "permissions" ? "active" : "") + '" onclick="GMDashboard.setTab(\'permissions\')">الاستئذانات</button>' +
        '<button class="tab-btn ' + (GMDashboard.tab === "archive" ? "active" : "") + '" onclick="GMDashboard.setTab(\'archive\')">الأرشيف والتقارير</button>' +
      '</div></div>' +
      '<div id="gm-tab-content"></div>';
    GMDashboard.target.innerHTML = tabsHtml;
    var content = el("gm-tab-content");

    if (GMDashboard.tab === "permissions") { PermissionsReportTab.mount(content, "gmPerm"); return; }
    if (GMDashboard.tab === "archive") { ArchiveTab.mount(content, "gmArch", GMDashboard.cities()); return; }

    var queue = GMDashboard.gmQueue();
    var filtered = applyClientFilters(queue, GMDashboard.filters);

    function groupCount(items, keyFn) {
      var map = {};
      items.forEach(function (i) { var k = keyFn(i); map[k] = (map[k] || 0) + 1; });
      return map;
    }
    function breakdownList(counts) {
      var keys = Object.keys(counts);
      if (keys.length === 0) return '<p class="muted">لا توجد بيانات.</p>';
      return '<ul class="breakdown-list">' + keys.map(function (k) { return '<li><span>' + escapeHtml(k) + '</span><strong>' + counts[k] + '</strong></li>'; }).join("") + '</ul>';
    }

    var body;
    if (GMDashboard.isLoading) body = renderCenterLoading("جارٍ تحميل الطلبات...");
    else if (GMDashboard.error) body = renderErrorState(GMDashboard.error, "GMDashboard.load");
    else body = renderRequestsTable(filtered, { showActions: true, canActFn: "gmCanActGlobal", onApproveFn: "gmApproveGlobal", onRejectFn: "gmRejectGlobal" });

    content.innerHTML =
      '<div class="stat-grid">' +
        renderStatCard("بانتظار اعتمادك مباشرة", queue.filter(GMDashboard.canAct).length, "") +
        renderStatCard("إجمالي الطلبات في النظام", GMDashboard.requests.length, "blue") +
        renderStatCard("معتمدة", GMDashboard.requests.filter(function (r) { return r.status === "approved"; }).length, "teal") +
        renderStatCard("مرفوضة", GMDashboard.requests.filter(function (r) { return r.status === "rejected"; }).length, "blue") +
      '</div>' +
      '<div class="breakdown-grid">' +
        '<div class="card"><h3 style="font-size:13.5px;color:var(--navy);margin:0 0 10px;">حسب الشركة</h3>' + breakdownList(groupCount(GMDashboard.requests, function (r) { return r.company; })) + '</div>' +
        '<div class="card"><h3 style="font-size:13.5px;color:var(--navy);margin:0 0 10px;">حسب المدينة</h3>' + breakdownList(groupCount(GMDashboard.requests, function (r) { return r.city || "غير محدد"; })) + '</div>' +
      '</div>' +
      renderFilterBar("gmQ", GMDashboard.filters, GMDashboard.cities()) +
      body;
  }
};

function gmCanActGlobal(r) { return GMDashboard.canAct(r); }
function gmApproveGlobal(id) { GMDashboard.approve(id); }
function gmRejectGlobal(id) { GMDashboard.reject(id); }
function gmQFilterChanged() { GMDashboard.filters = readFilterBar("gmQ"); GMDashboard.renderInto(); }

        '<button class="tab-btn ' + (COPage.tab === "leaves" ? "active" : "") + '" onclick="COPage.setTab(\'leaves\')">الإجازات</button>' +
        '<button class="tab-btn ' + (COPage.tab === "permissions" ? "active" : "") + '" onclick="COPage.setTab(\'permissions\')">الاستئذانات</button>' +
      '</div></div>' +
      '<div id="co-tab-content"></div>';
    COPage.target.innerHTML = tabsHtml;
    var content = el("co-tab-content");

    if (COPage.tab === "permissions") { PermissionsReportTab.mount(content, "coPerm"); return; }

    var summary = "";
    if (COPage.isLoading) summary = renderCenterLoading("جارٍ تحميل الملخص...");
    else if (COPage.error) summary = renderErrorState(COPage.error, "COPage.load");
    else {
      var r = COPage.requests;
      summary = '<div class="stat-grid">' +
        renderStatCard("إجمالي الطلبات", r.length, "") +
        renderStatCard("قيد المراجعة", r.filter(function (x) { return x.status.indexOf("pending") === 0; }).length, "blue") +
        renderStatCard("معتمدة", r.filter(function (x) { return x.status === "approved"; }).length, "teal") +
        renderStatCard("مرفوضة", r.filter(function (x) { return x.status === "rejected"; }).length, "blue") +
      '</div>';
    }
    var cities = COPage.requests ? Array.from(new Set(COPage.requests.map(function (r) { return r.city; }).filter(Boolean))) : [];

    content.innerHTML = summary + '<div id="co-archive-host"></div>';
    ArchiveTab.mount(el("co-archive-host"), "coArch", cities, true);
  }
};
